<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMPN 3 LURAGUNG - Berakhlak & Berprestasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://source.unsplash.com/random/1920x1080/?school');
            background-size: cover;
            background-position: center;
            height: 60vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card-berita {
            transition: transform 0.3s;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card-berita:hover { transform: translateY(-5px); }
        .card-img-top { height: 200px; object-fit: cover; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏫 SMPN 3 LURAGUNG</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="#">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Profil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Guru</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="window.scrollTo(0, document.body.scrollHeight);">Kontak</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <header class="hero-section">
        <div class="container">
            <h1 class="display-4 fw-bold">Selamat Datang</h1>
            <p class="lead">Pusat Informasi Digital SMP Negeri 3 Luragung</p>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <h2 class="fw-bold mb-4 border-start border-5 border-primary ps-3">📢 Berita Terbaru</h2>
            
            <div id="loading-text" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Sedang mengambil berita dari kantor guru...</p>
            </div>
            
            <div class="row g-4" id="wadah-berita">
                </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 text-center">
        <small>&copy; 2025 SMPN 3 Luragung. Powered by Google Sheet.</small>
    </footer>

    <script>
        // =================================================================
        // 👇 PASTE LINK PANJANG (APPS SCRIPT) DI DALAM TANDA KUTIP DI BAWAH INI 👇
        // =================================================================
        
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyGCcXoJ9CySCs_LPGn3thXtvvBnigpKQRZe4_iAgw3MAoCX9pqyhxAZC1NeIm5qpC2MQ/exec";
        
        // =================================================================

        const wadahBerita = document.getElementById('wadah-berita');
        const loadingText = document.getElementById('loading-text');

        fetch(URL_APPS_SCRIPT)
            .then(response => response.json())
            .then(data => {
                loadingText.style.display = 'none'; // Sembunyikan loading
                
                // Urutkan berita dari yang paling baru (bawah ke atas)
                data.reverse().forEach(berita => {
                    // Kalau gambar kosong, pakai gambar default
                    let gambar = berita.gambar ? berita.gambar : 'https://source.unsplash.com/random/400x300/?book';
                    
                    let kartuHTML = `
                        <div class="col-md-4">
                            <div class="card card-berita h-100">
                                <img src="${gambar}" class="card-img-top" alt="...">
                                <div class="card-body">
                                    <small class="text-primary fw-bold">${berita.tanggal}</small>
                                    <h5 class="card-title mt-2 fw-bold">${berita.judul}</h5>
                                    <p class="card-text text-muted">${berita.isi.substring(0, 100)}...</p>
                                </div>
                            </div>
                        </div>
                    `;
                    wadahBerita.innerHTML += kartuHTML;
                });
            })
            .catch(error => {
                loadingText.innerHTML = '<p class="text-danger">Gagal mengambil berita. Cek koneksi atau Link Script!</p>';
                console.error('Error:', error);
            });
    </script>

</body>
</html>
